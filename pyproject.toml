[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provy-sdk"
version = "0.5.2"
description = "Python SDK for Provy: prove your AI agents actually worked"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Provy" }]
keywords = ["observability", "llm", "agents", "opentelemetry", "evals", "outcome-assurance"]
# Base install is the ingest client (REST + OTel exporter) — send traces with an
# ingest key, no database credentials. Heavy pieces are opt-in extras below.
dependencies = [
    "requests>=2.28",
    "pytz>=2023.3",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Client-side LLM-as-judge (e.g. circuit breakers). Server-side judging needs nothing here.
judge = ["anthropic>=0.25.0"]
# Legacy local engine + direct-DB writes. New pipelines should use the ingest API instead.
engine = ["supabase>=2.0.0"]
# OTel exporter helpers (ProvyExporter works once these are present).
otel = ["opentelemetry-sdk>=1.20.0", "opentelemetry-api>=1.20.0"]
all = [
    "anthropic>=0.25.0",
    "supabase>=2.0.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-api>=1.20.0",
]

[project.urls]
Documentation = "https://provy.ai/knowledge/index"
Issues = "https://github.com/amitgarg73/provy-sdk/issues"
Homepage = "https://provy.ai"
Repository = "https://github.com/amitgarg73/provy-sdk"

[tool.setuptools.packages.find]
include = ["provy*"]
