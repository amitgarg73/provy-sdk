name: CI

# Runs on every push and PR. This repo has no deploy pipeline attached, which is the point of
# splitting it out: the SDK ships on its own clock, not the website's.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.10. Test the floor and the current release, or that
        # declaration is a guess rather than a promise.
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" pytest
      - name: Test
        run: pytest -q
      - name: Import the public surface exactly as a user would
        run: python -c "from provy import ProvyClient, ProvyExporter; import provy; print(provy.__version__)"
